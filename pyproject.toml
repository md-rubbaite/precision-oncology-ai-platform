[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoai"
version = "1.0.0"
description = "Research platform for somatic mutation data: file checks, tumour mutational burden, substitution profiles, cohort statistics and a calibrated tumour-type classifier with abstention. Research use only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rubbaite T. Hassain" }]
keywords = ["cancer-genomics", "bioinformatics", "precision-oncology", "machine-learning", "tcga", "maf", "tumor-mutational-burden"]
dependencies = [
    "numpy>=2.2,<3",
    "fastapi>=0.165.0,<1",
    "uvicorn>=0.54.0,<1",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.6,<2"]
dev = ["scikit-learn>=1.6,<2", "scipy>=1.14", "pytest>=9.1.1", "ruff>=0.17.5", "httpx2>=2.16.2"]

[project.scripts]
oncoai = "oncoai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oncoai = ["studies.toml", "dashboard/index.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008: FastAPI dependencies are declared as default arguments by design
ignore = ["B008"]
